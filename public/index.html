<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Guess — Marquee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F1C;
    --bg-vignette: radial-gradient(ellipse at 50% -10%, #16213C 0%, #0A0F1C 60%);
    --frame: #141C30;
    --frame-edge: #232D48;
    --bulb-off: #263050;
    --bulb-off-ring: #34406A;
    --bulb-lit: #FFC857;
    --bulb-lit-core: #FFF2CE;
    --miss: #E4572E;
    --miss-dim: #6E2E1E;
    --cream: #F3ECDA;
    --ink-soft: #8B96B3;
    --ink-faint: #56618A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-vignette), var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .stage {
    width: 100%;
    max-width: 600px;
  }

  /* ---------- Header ---------- */
  .brand {
    text-align: center;
    margin-bottom: 28px;
  }

  .brand h1 {
    font-family: 'Bungee', cursive;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: 2px;
    margin: 0;
    color: var(--bulb-lit);
    text-shadow:
      0 0 6px rgba(255, 200, 87, 0.55),
      0 0 22px rgba(255, 200, 87, 0.25);
  }

  .brand .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 6px;
  }

  /* ---------- Marquee frame ---------- */
  .marquee {
    position: relative;
    background: linear-gradient(180deg, var(--frame) 0%, #101828 100%);
    border-radius: 18px;
    border: 1px solid var(--frame-edge);
    padding: 34px 26px 28px;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.03);
    margin-bottom: 22px;
  }

  .marquee-bulbs {
    position: absolute;
    inset: 8px;
    border-radius: 12px;
    pointer-events: none;
  }

  .marquee-bulbs span {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--bulb-lit);
    box-shadow: 0 0 5px 1px rgba(255,200,87,0.7);
    animation: twinkle 2.6s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  /* ---------- Status line ---------- */
  #statusLine {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.3px;
    color: var(--ink-soft);
    min-height: 18px;
    margin-bottom: 22px;
  }
  #statusLine.correct { color: var(--bulb-lit); }
  #statusLine.wrong { color: var(--miss); }

  /* ---------- Letter board ---------- */
  .board {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 26px;
  }

  .bulb-tile {
    position: relative;
    width: 46px;
    height: 58px;
    border-radius: 10px 10px 6px 6px;
    background: radial-gradient(circle at 50% 38%, #1B2338 0%, #10162A 75%);
    border: 1.5px dashed var(--bulb-off-ring);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bungee', cursive;
    font-size: 22px;
    color: transparent;
    transition: all 0.35s ease;
  }

  .bulb-tile.filled {
    border-style: solid;
    border-color: var(--bulb-lit);
    background: radial-gradient(circle at 50% 35%, var(--bulb-lit-core) 0%, var(--bulb-lit) 55%, #C98F1F 100%);
    color: #2A1A00;
    box-shadow:
      0 0 10px 2px rgba(255,200,87,0.55),
      0 0 28px 6px rgba(255,200,87,0.25);
    animation: pop-on 0.35s ease;
  }

  .bulb-tile.filled::after { content: attr(data-letter); }

  @keyframes pop-on {
    0% { transform: scale(0.7); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* ---------- Attempts / bulb string tracker ---------- */
  .tracker-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .bulb-string { display: flex; gap: 7px; }

  .mini-bulb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bulb-lit);
    box-shadow: 0 0 6px 1px rgba(255,200,87,0.6);
    transition: all 0.3s ease;
  }

  .mini-bulb.burnt {
    background: var(--miss-dim);
    box-shadow: none;
    animation: flicker-out 0.4s ease;
  }

  @keyframes flicker-out {
    0% { background: var(--miss); box-shadow: 0 0 10px 2px rgba(228,87,46,0.8); }
    50% { background: var(--bulb-off); }
    100% { background: var(--miss-dim); }
  }

  /* ---------- Keyboard ---------- */
  .keyboard {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap: 7px;
    margin-bottom: 8px;
  }

  .key {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 0;
    text-align: center;
    border-radius: 8px;
    background: var(--frame-edge);
    border: 1px solid #303C60;
    color: var(--cream);
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }

  .key:hover:not(:disabled) {
    background: #303C60;
    transform: translateY(-1px);
    box-shadow: 0 0 8px rgba(255,200,87,0.15);
  }
  .key:active:not(:disabled) { transform: translateY(0); }

  .key:focus-visible {
    outline: 2px solid var(--bulb-lit);
    outline-offset: 2px;
  }

  .key.correct {
    background: var(--bulb-lit);
    color: #2A1A00;
    border-color: #C98F1F;
    box-shadow: 0 0 10px rgba(255,200,87,0.4);
  }

  .key.wrong {
    background: transparent;
    color: var(--miss);
    border-color: var(--miss-dim);
    text-decoration: line-through;
    opacity: 0.6;
  }

  .key:disabled { cursor: default; }

  /* ---------- Footer ---------- */
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
  }

  .attempts {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .attempts strong { color: var(--cream); }

  button.new-game {
    font-family: 'Bungee', cursive;
    font-size: 13px;
    letter-spacing: 1px;
    background: transparent;
    color: var(--bulb-lit);
    border: 1.5px solid var(--bulb-lit);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  button.new-game:hover {
    background: var(--bulb-lit);
    color: #2A1A00;
    box-shadow: 0 0 16px rgba(255,200,87,0.4);
  }

  /* ---------- Result banner ---------- */
  .result-banner {
    text-align: center;
    font-family: 'Bungee', cursive;
    font-size: 16px;
    letter-spacing: 0.5px;
    padding: 14px;
    margin-bottom: 22px;
    border-radius: 10px;
    display: none;
  }
  .result-banner.show { display: block; }
  .result-banner.won {
    background: rgba(255,200,87,0.12);
    color: var(--bulb-lit);
    border: 1px solid var(--bulb-lit);
    box-shadow: 0 0 20px rgba(255,200,87,0.15);
  }
  .result-banner.lost {
    background: rgba(228,87,46,0.1);
    color: var(--miss);
    border: 1px solid var(--miss-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .bulb-tile, .key, .mini-bulb, .marquee-bulbs span { animation: none !important; transition: none !important; }
  }

  @media (max-width: 420px) {
    .bulb-tile { width: 38px; height: 50px; font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="stage">

    <div class="brand">
      <h1>WORD GUESS</h1>
      <div class="tag">tonight's feature — one letter at a time</div>
    </div>

    <div class="marquee">
      <div class="marquee-bulbs" id="marqueeBulbs"></div>

      <div id="statusLine" role="status" aria-live="polite">Starting a new round…</div>

      <div id="resultBanner" class="result-banner"></div>

      <div id="board" class="board"></div>

      <div class="tracker-row">
        <span>Misses</span>
        <div id="tracker" class="bulb-string"></div>
      </div>

      <div id="keyboard" class="keyboard"></div>

      <div class="footer-row">
        <div class="attempts">Attempts left: <strong id="attemptsLeft">–</strong></div>
        <button class="new-game" id="newGameBtn">New Word</button>
      </div>
    </div>

  </div>

<script>
  const API_BASE = ''; // same origin as this page — change to 'http://localhost:8080' if opening this file directly
  let sessionId = null;
  let maxAttempts = 6;

  const boardEl = document.getElementById('board');
  const keyboardEl = document.getElementById('keyboard');
  const trackerEl = document.getElementById('tracker');
  const statusEl = document.getElementById('statusLine');
  const attemptsEl = document.getElementById('attemptsLeft');
  const bannerEl = document.getElementById('resultBanner');
  const newGameBtn = document.getElementById('newGameBtn');
  const marqueeBulbsEl = document.getElementById('marqueeBulbs');

  const ALPHABET = 'abcdefghijklmnopqrstuvwxyz'.split('');

  function scatterMarqueeBulbs() {
    marqueeBulbsEl.innerHTML = '';
    const count = 26;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('span');
      const t = i / count;
      // distribute around the rounded-rect perimeter roughly
      const side = Math.floor(t * 4);
      const pos = (t * 4) % 1;
      let x, y;
      if (side === 0) { x = pos * 100; y = 0; }
      else if (side === 1) { x = 100; y = pos * 100; }
      else if (side === 2) { x = 100 - pos * 100; y = 100; }
      else { x = 0; y = 100 - pos * 100; }
      b.style.left = x + '%';
      b.style.top = y + '%';
      b.style.animationDelay = (i * 0.11) + 's';
      marqueeBulbsEl.appendChild(b);
    }
  }

  function buildKeyboard() {
    keyboardEl.innerHTML = '';
    ALPHABET.forEach(letter => {
      const key = document.createElement('button');
      key.className = 'key';
      key.textContent = letter.toUpperCase();
      key.dataset.letter = letter;
      key.addEventListener('click', () => submitGuess(letter));
      keyboardEl.appendChild(key);
    });
  }

  function renderBoard(masked) {
    boardEl.innerHTML = '';
    masked.split('').forEach(ch => {
      const tile = document.createElement('div');
      tile.className = 'bulb-tile' + (ch !== '*' ? ' filled' : '');
      if (ch !== '*') tile.dataset.letter = ch;
      boardEl.appendChild(tile);
    });
  }

  function renderTracker(wrongCount) {
    trackerEl.innerHTML = '';
    for (let i = 0; i < maxAttempts; i++) {
      const dot = document.createElement('div');
      dot.className = 'mini-bulb' + (i < wrongCount ? ' burnt' : '');
      trackerEl.appendChild(dot);
    }
  }

  function updateKeyboardState(wrongLetters, guessedCorrectLetters) {
    document.querySelectorAll('.key').forEach(key => {
      const letter = key.dataset.letter;
      key.classList.remove('correct', 'wrong');
      if (wrongLetters.includes(letter)) {
        key.classList.add('wrong');
        key.disabled = true;
      } else if (guessedCorrectLetters.includes(letter)) {
        key.classList.add('correct');
        key.disabled = true;
      } else {
        key.disabled = false;
      }
    });
  }

  function applyState(data) {
    sessionId = data.sessionId;
    maxAttempts = data.maxAttempts;

    renderBoard(data.masked);
    renderTracker(data.wrongLetters.length);
    attemptsEl.textContent = data.remainingAttempts;

    const guessedCorrectLetters = data.masked.toLowerCase().split('').filter(c => c !== '*');
    updateKeyboardState(data.wrongLetters, guessedCorrectLetters);

    statusEl.textContent = data.message;
    statusEl.className = data.guessCorrect ? 'correct' : (data.guessValid === false ? '' : 'wrong');

    if (data.gameOver) {
      document.querySelectorAll('.key').forEach(k => k.disabled = true);
      bannerEl.classList.add('show');
      if (data.won) {
        bannerEl.textContent = '★ SOLVED — IT WAS "' + data.secretWord.toUpperCase() + '" ★';
        bannerEl.className = 'result-banner show won';
      } else {
        bannerEl.textContent = 'LIGHTS OUT — IT WAS "' + data.secretWord.toUpperCase() + '"';
        bannerEl.className = 'result-banner show lost';
      }
    } else {
      bannerEl.classList.remove('show');
      bannerEl.className = 'result-banner';
    }
  }

  async function startNewGame() {
    statusEl.textContent = 'Starting a new round…';
    statusEl.className = '';
    bannerEl.classList.remove('show');
    buildKeyboard();

    const res = await fetch(API_BASE + '/api/new', { method: 'POST' });
    const data = await res.json();
    applyState(data);
  }

  async function submitGuess(letter) {
    if (!sessionId) return;
    const res = await fetch(API_BASE + '/api/guess', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, letter })
    });
    const data = await res.json();
    applyState(data);
  }

  document.addEventListener('keydown', (e) => {
    const letter = e.key.toLowerCase();
    if (ALPHABET.includes(letter)) {
      const key = document.querySelector('.key[data-letter="' + letter + '"]');
      if (key && !key.disabled) submitGuess(letter);
    }
  });

  newGameBtn.addEventListener('click', startNewGame);

  scatterMarqueeBulbs();
  startNewGame();
</script>
</body>
</html>
